[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spotify-youtube-library-mac"
version = "2.1.0"
description = "Resumable Spotify, YouTube MP3/MOV, and local Apple Music workflow"
requires-python = ">=3.11"
dependencies = [
  "mutagen>=1.47,<2",
  "openpyxl>=3.1,<4",
  "requests>=2.32,<3",
  "yt-dlp[default]",
  "bgutil-ytdlp-pot-provider>=1.3.1,<2",
]

[project.scripts]
music-library = "music_library_app.cli:main"

[tool.setuptools]
py-modules = [
  "activity_log",
  "audit_history",
  "apple_music_duplicates",
  "common",
  "download_mp3",
  "download_video",
  "failures",
  "import_review",
  "iphone_sync",
  "library_status",
  "liked_songs_playlist",
  "matching_rules",
  "music_library",
  "music_album_artist_cleanup",
  "music_artist_credits",
  "music_library_consistency",
  "music_library_audit",
  "music_genres",
  "music_metadata",
  "music_delete_queue",
  "recent_additions",
  "reset_matches",
  "spotify_sync",
  "spotify_playlists_to_music",
  "youtube_match",
]

[tool.setuptools.packages.find]
include = ["music_library_app*"]

[tool.setuptools.data-files]
"share/spotify-youtube-library-mac" = ["apple_music_bridge.applescript"]
